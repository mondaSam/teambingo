
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colliers Office Bingo - Host</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: linear-gradient(145deg,#e4edf6,#f7f9fc);
    color: #003b71;
    font: 16px system-ui,sans-serif;
    min-height: 100vh;
}

main {
    max-width: 850px;
    margin: 32px auto;
    padding: 32px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 8px 32px #003b7115;
    text-align: center;
}

header {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 3px;
    border-bottom: 4px solid #efb321;
    padding-bottom: 16px;
}

header small {
    display: block;
    font-size: 11px;
    letter-spacing: 3px;
}

h1 {
    font-size: 36px;
    margin-bottom: 0;
}

p {
    color: #52677b;
}

.host-label {
    display: inline-block;
    background: #003b71;
    color: white;
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: bold;
}

#current {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 180px;
    font-size: clamp(28px,6vw,52px);
    font-weight: 800;
    padding: 30px;
    margin: 24px 0;
    background: #edf4fa;
    border: 2px solid #cbd9e7;
    border-bottom: 5px solid #efb321;
    border-radius: 12px;
}

button {
    font: inherit;
    border-radius: 8px;
    padding: 14px 24px;
    background: #003b71;
    color: white;
    border: 0;
    cursor: pointer;
    font-weight: 650;
}

button:hover {
    filter: brightness(.95);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

button:focus-visible {
    outline: 3px solid #efb321;
    outline-offset: 2px;
}

#draw {
    width: 100%;
    max-width: 400px;
    font-size: 20px;
    padding: 18px;
}

.secondary {
    background: #e8eef4;
    color: #003b71;
    margin-top: 16px;
}

#counter {
    font-weight: 600;
    margin: 20px 0 10px;
}

.progress {
    background: #e8eef4;
    height: 10px;
    border-radius: 10px;
    overflow: hidden;
}

#progress-bar {
    height: 100%;
    width: 0;
    background: #efb321;
    transition: width .3s;
}

.history-section {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #dce5ed;
}

#history {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
}

#history span {
    background: #edf4fa;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
}

#history span.latest {
    background: #003b71;
    color: white;
}

@media(max-width:500px) {
    main {
        margin: 0;
        padding: 16px;
        border-radius: 0;
    }

    #current {
        min-height: 150px;
        padding: 20px;
    }
}
</style>
</head>

<body>

<main>

    <header>
        COLLIERS
        <small>PROJECT LEADERS</small>
    </header>

    <h1>Office Bingo</h1>
    <p>Monthly team social</p>

    <span class="host-label">HOST PANEL</span>

    <div id="current" aria-live="polite">
        Ready to play?
    </div>

    <button id="draw">
        Draw next phrase
    </button>

    <p id="counter"></p>

    <div class="progress">
        <div id="progress-bar"></div>
    </div>

    <section class="history-section">

        <h2>Called phrases</h2>

        <p id="empty-history">
            No phrases have been called yet.
        </p>

        <div id="history"></div>

    </section>

    <button id="reset" class="secondary">
        Reset game
    </button>

</main>

<script>

const WORDS = [
    "You're on mute",
    "Coffee break",
    "Kahua",
    "Quick question",
    "Happy Friday",
    "SharePoint",
    "Excel formula",
    "Follow-up email",
    "Teams meeting",
    "Screen sharing",
    "Site visit",
    "Working remotely",
    "Lunch break",
    "Calendar invite",
    "Let's circle back",
    "You're breaking up",
    "Can you see my screen?",
    "PowerPoint",
    "Outlook",
    "Meeting minutes",
    "Please see attached",
    "Submit timesheet",
    "Submit expenses",
    "Let's take this offline",
    "North",
    "Southwest",
    "East",
    "Central",
    "Submit your MPSRs!",
    "Can you hear me?",
    "My camera is not working!",
    "You're sharing the wrong screen",
    "Let's touch base",
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Monitor",
    "Phone",
    "Mouse",
    "Keyboard",
    "Headphones",
    "Desk",
    "Microphone",
    "Webcam",
    "Laptop",
    "Office chair",
    "Notebook",
    "Water bottle",
    "Coffee mug",
    "Charger"
];

const $ = id => document.getElementById(id);

let called = [];

try {
    const saved = JSON.parse(
        localStorage.getItem('office-bingo-host-v2')
    );

    if (Array.isArray(saved)) {
        called = [...new Set(saved)]
            .filter(word => WORDS.includes(word));
    }

} catch(e) {}

function save() {

    try {
        localStorage.setItem(
            'office-bingo-host-v2',
            JSON.stringify(called)
        );
    } catch(e) {}
}

function render() {

    $('current').textContent =
        called.length > 0
        ? called[called.length - 1]
        : 'Ready to play?';

    $('counter').textContent =
        called.length + ' of ' + WORDS.length +
        ' phrases called — ' +
        (WORDS.length - called.length) + ' remaining';

    $('progress-bar').style.width =
        (called.length / WORDS.length * 100) + '%';

    $('empty-history').hidden = called.length > 0;

    $('history').replaceChildren(
        ...called.map((word, i) => {

            const item = document.createElement('span');

            item.textContent = (i + 1) + '. ' + word;

            if (i === called.length - 1) {
                item.className = 'latest';
            }

            return item;
        })
    );

    $('draw').disabled = called.length === WORDS.length;

    $('draw').textContent =
        called.length === WORDS.length
        ? 'All phrases have been called!'
        : 'Draw next phrase';
}

$('draw').onclick = () => {

    const remaining = WORDS.filter(
        word => !called.includes(word)
    );

    if (remaining.length === 0) return;

    const randomIndex = Math.floor(
        Math.random() * remaining.length
    );

    const nextWord = remaining[randomIndex];

    called.push(nextWord);

    save();
    render();
};

$('reset').onclick = () => {

    if (confirm('Reset the game and clear all called phrases?')) {

        called = [];

        save();
        render();
    }
};

render();

</script>

</body>
</html>
